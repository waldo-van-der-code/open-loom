<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Demo dashboard</title>
<style>
body{margin:0;font:20px/1.4 -apple-system,Helvetica,Arial,sans-serif;background:#f4f5f9;color:#1d1d28}
header{background:#1d1d28;color:#fff;padding:18px 32px;font-size:24px;font-weight:600}
nav{display:flex;gap:8px;padding:18px 32px 0}
nav button{font:inherit;padding:10px 22px;border:0;border-radius:8px 8px 0 0;background:#dfe1ec;cursor:pointer}
nav button.on{background:#fff;font-weight:600}
main{background:#fff;margin:0 32px;padding:28px 32px;border-radius:0 8px 8px 8px;min-height:380px}
.tab{display:none}.tab.on{display:block}
.cards{display:flex;gap:20px;margin-bottom:24px}
.card{flex:1;background:#f4f5f9;border-radius:10px;padding:18px}
.card b{display:block;font-size:40px}
table{border-collapse:collapse;width:100%}td,th{text-align:left;padding:10px 12px;border-bottom:1px solid #e3e4ee}
</style></head><body>
<header>Demo dashboard (fake data)</header>
<nav><button class="on" data-t="overview">Overview</button><button data-t="orders">Orders</button><button data-t="customers">Customers</button></nav>
<main>
  <section class="tab on" id="overview"><div class="cards">
    <div class="card"><b>128</b>Orders this week</div><div class="card"><b>42</b>New customers</div><div class="card"><b>96%</b>On-time delivery</div></div>
    <p>Pick a tab above to see the details.</p></section>
  <section class="tab" id="orders"><table><tr><th>Order</th><th>Item</th><th>Status</th></tr>
    <tr><td>#1001</td><td>Desk lamp</td><td>Shipped</td></tr><tr><td>#1002</td><td>Notebook</td><td>Packed</td></tr><tr><td>#1003</td><td>Headphones</td><td>Delivered</td></tr></table></section>
  <section class="tab" id="customers"><table><tr><th>Customer</th><th>City</th><th>Orders</th></tr>
    <tr><td>Customer A</td><td>Springfield</td><td>12</td></tr><tr><td>Customer B</td><td>Rivertown</td><td>7</td></tr><tr><td>Customer C</td><td>Lakeside</td><td>3</td></tr></table></section>
</main>
<script>
document.querySelectorAll('nav button').forEach(b => b.onclick = () => {
  document.querySelectorAll('nav button, .tab').forEach(e => e.classList.remove('on'));
  b.classList.add('on'); document.getElementById(b.dataset.t).classList.add('on');
});
</script></body></html>
